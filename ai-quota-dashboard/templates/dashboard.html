<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quota & Limits Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 8px; }
    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .provider-name { font-size: 16px; font-weight: 700; color: var(--primary); }
    .account-label { font-size: 12px; color: var(--muted); }
    .metrics {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .progress-bar-bg {
      background: #0f172a;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .reset-info { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>⚡</span> AI Quotas & Subscription Limits</h1>
    <span class="status-badge" id="updated-label">Live</span>
  </div>
  <div class="grid" id="quota-grid">
    <!-- Populated dynamically from JSON cache -->
  </div>
  <script>
    async function loadQuotas() {
      try {
        const res = await fetch('/api/quotas');
        const data = await res.json();
        const grid = document.getElementById('quota-grid');
        grid.innerHTML = '';
        document.getElementById('updated-label').innerText = 'Updated: ' + new Date(data.collected_at).toLocaleTimeString();

        (data.providers || []).forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          const pct = p.percent_used || 0;
          const color = pct > 85 ? 'var(--danger)' : pct > 50 ? 'var(--warning)' : 'var(--success)';
          card.innerHTML = `
            <div class="card-header">
              <span class="provider-name">${p.provider}</span>
              <span class="account-label">${p.account || ''}</span>
            </div>
            <div class="metrics">
              <span>Used: <strong>${p.used}</strong> / ${p.limit} ${p.unit || ''}</span>
              <span><strong>${pct}%</strong></span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${Math.min(pct, 100)}%; background: ${color};"></div>
            </div>
            ${p.resets_at ? `<div class="reset-info">Resets: ${new Date(p.resets_at).toLocaleString()}</div>` : ''}
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        console.error('Failed to load quotas', e);
      }
    }
    loadQuotas();
    setInterval(loadQuotas, 30000);
  </script>
</body>
</html>
